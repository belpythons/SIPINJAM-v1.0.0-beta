name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check code style
        run: vendor/bin/pint --test

      # Test memakai SQLite in-memory (lihat phpunit.xml), jadi tidak perlu
      # service MySQL. Kueri bentrok jadwal sudah portabel lintas driver (B-15).
      - name: Run tests
        run: php artisan test

      - name: Verify no env() outside config/
        run: |
          if grep -rn --include='*.php' "env(" app/ | grep -v '^\s*\*' | grep -v '\* '; then
            echo "::error::env() ditemukan di app/ — pindahkan ke config/."
            exit 1
          fi

      - name: Verify PDF templates have no external CDN
        run: |
          if grep -rn "cdn.tailwindcss.com\|fonts.googleapis.com\|cdnjs.cloudflare.com" resources/; then
            echo "::error::Template masih bergantung pada CDN eksternal."
            exit 1
          fi
